name: OfficeMax Mac font verification
on:
  push:
    branches: [build/officemax-m5-preview-macos26]
    paths:
      - .github/workflows/officemax-m5-fonts.yml
      - tools/probe-mac-latex-fonts.mjs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fonts:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Download the already built Mac app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41132011184 --repo charleskang/openoffice --name OfficeMax-M5-package-candidate --dir candidate
          ditto -x -k candidate/OfficeMax-0.13.4-mac-preview.1-arm64-mac.zip package
      - name: Download the previous official engine for comparison
        run: |
          mkdir previous-engine
          curl --fail --location https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-aarch64-apple-darwin.tar.gz -o previous-engine/engine.tar.gz
          shasum -a 256 previous-engine/engine.tar.gz
          tar -xzf previous-engine/engine.tar.gz -C previous-engine
      - name: Compare actual font output
        run: node tools/probe-mac-latex-fonts.mjs package/OfficeMax.app font-checks previous-engine/tectonic
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: OfficeMax-Mac-font-checks
          path: font-checks/
          retention-days: 7
